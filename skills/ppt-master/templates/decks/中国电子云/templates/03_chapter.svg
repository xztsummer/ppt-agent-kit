<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="cec_cloud_brand_master" data-pptx-master-name="中国电子云品牌"
  data-pptx-layout="chapter" data-pptx-layout-name="章节页">
  <image id="cec-master-bg" x="0" y="0" width="1280" height="720"
    href="../images/brand_bg_blue.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <image id="chapter-bg" x="0" y="0" width="1280" height="720"
    href="../images/chapter_bg.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="chapter-logo" x="1049.27" y="30.54" width="201.38" height="44.43"
    href="../images/logo_white_small.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="chapter-divider" x1="275.83" y1="277.2" x2="275.83" y2="390.77"
    stroke="#FFFFFF" stroke-width="1.33"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="chapter-number-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="75 258 175 152">
    <text id="chapter-number-carrier" data-pptx-carrier="true"
      x="240.43" y="362.65" text-anchor="end" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="117.33" font-weight="bold">{{CHAPTER_NUM}}</text>
  </g>
  <g id="chapter-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="322 265 661 139">
    <text id="chapter-title-carrier" data-pptx-carrier="true"
      x="331.4" y="352" fill="#FFFFFF"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="53.33">{{CHAPTER_TITLE}}</text>
  </g>
</svg>
