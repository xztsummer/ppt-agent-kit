<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="cec_cloud_brand_master" data-pptx-master-name="中国电子云品牌"
  data-pptx-layout="cover" data-pptx-layout-name="封面-主副标题">
  <image id="cec-master-bg" x="0" y="0" width="1280" height="720"
    href="../images/brand_bg_blue.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <image id="cover-illustration" x="579.87" y="109.67" width="700.13" height="512.47"
    href="../images/cover_illustration.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="cover-logo" x="65.33" y="62.67" width="317.8" height="70.13"
    href="../images/logo_white.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="73 211 867 125">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="73" y="301" fill="#FFFFFF"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="80" font-weight="bold">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="73 339 867 68">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="73" y="389" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="53.33">{{SUBTITLE}}</text>
  </g>
  <g id="cover-author-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="73 535 867 36">
    <text id="cover-author-carrier" data-pptx-carrier="true"
      x="73" y="561" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="26.67">{{AUTHOR}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="3"
    data-pptx-bounds="73 571 867 38">
    <text id="cover-date-carrier" data-pptx-carrier="true"
      x="73" y="597" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="26.67">{{DATE}}</text>
  </g>
