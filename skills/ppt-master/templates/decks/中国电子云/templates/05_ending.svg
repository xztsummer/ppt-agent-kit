<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="cec_cloud_brand_master" data-pptx-master-name="中国电子云品牌"
  data-pptx-layout="ending" data-pptx-layout-name="封底">
  <image id="cec-master-bg" x="0" y="0" width="1280" height="720"
    href="../images/brand_bg_blue.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <image id="ending-logo" x="499.45" y="525.89" width="281.1" height="62.02"
    href="../images/logo_ending.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="ending-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="191 265 897 135">
    <text id="ending-title-carrier" data-pptx-carrier="true"
      x="640" y="360" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="96" font-weight="bold" letter-spacing="8">{{THANK_YOU}}</text>
  </g>
  <g id="ending-contact-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="340 612 600 40">
    <text id="ending-contact-carrier" data-pptx-carrier="true"
      x="640" y="640" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="20">{{CONTACT_INFO}}</text>
  </g>
</svg>
