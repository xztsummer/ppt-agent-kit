<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="cec_cloud_content_master" data-pptx-master-name="中国电子云内容"
  data-pptx-layout="content" data-pptx-layout-name="内容页-浅色">
  <rect id="cec-master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="content-title-accent" x="0" y="38" width="32.53" height="34" fill="#0058FF"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="content-logo" x="1049.27" y="30.45" width="201.4" height="44.43"
    href="../images/logo_blue.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="content-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="42 30 975 48">
    <text id="content-title-carrier" data-pptx-carrier="true"
      x="51.57" y="65" fill="#0058FF"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="32" font-weight="bold">{{PAGE_TITLE}}</text>
  </g>
  <g id="content-subtitle-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="42 79 1195 77">
    <text id="content-subtitle-carrier" data-pptx-carrier="true"
      x="51.57" y="101" fill="#090909"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="21.33">{{PAGE_SUBTITLE}}</text>
  </g>
  <g id="content-object-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="42 180 1196 470">
    <text id="content-object-carrier" data-pptx-carrier="true"
      x="52" y="214" fill="#C2C2C2"
      font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"
      font-size="20">{{CONTENT_AREA}}</text>
  </g>
  <g id="content-slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="3"
    data-pptx-bounds="1214 682 48 27.5">
    <text id="content-slide-number-carrier" data-pptx-carrier="true"
      x="1262" y="699" text-anchor="end" fill="#C2C2C2"
      font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="14.67">{{PAGE_NUM}}</text>
  </g>
</svg>
